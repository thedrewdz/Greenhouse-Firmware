[env:esp32dev]
; Pinned for reproducible builds: 6.6.0 bundles ESP-IDF 5.2.1, matching sdkconfig.esp32dev.
; Upgrade deliberately (see issue #25), never by leaving this unpinned.
platform = espressif32@6.6.0
board = esp32dev
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
